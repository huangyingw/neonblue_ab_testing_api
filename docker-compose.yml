version: "3.8"

services:
  # Production API service
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/ab_testing.db
      - API_TOKENS=["test-token-123","test-token-456"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development service with hot reload
  dev:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/ab_testing.db
      - API_TOKENS=["test-token-123","test-token-456"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

  # Unit test runner (isolated, no server needed)
  test:
    build: .
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=sqlite:///./test.db
      - API_TOKENS=["test-token-123","test-token-456"]
    command: pytest tests/test_api.py -v
    profiles:
      - test

  # Integration test API server
  api-test:
    build: .
    environment:
      - DATABASE_URL=sqlite:///./integration_test.db
      - API_TOKENS=["test-token-123","test-token-456"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - integration

  # Integration test runner (connects to api-test)
  integration:
    build: .
    volumes:
      - ./tests:/app/tests
    environment:
      - API_BASE_URL=http://api-test:8000
      - API_TOKENS=["test-token-123","test-token-456"]
    command: pytest tests/test_integration.py -v --tb=short
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - integration
